name: Compilar APK Port Arcane Codex

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PortArcaneCodex/**'
      - '.github/workflows/arcane-codex-apk.yml'

permissions:
  contents: read

concurrency:
  group: port-arcane-codex-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: '1'
    steps:
      - name: Obter fontes
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Java para Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: "false"
      - name: Instalar dependências JavaScript
        working-directory: PortArcaneCodex
        run: npm install --no-audit --no-fund
      - name: Verificar o código
        working-directory: PortArcaneCodex
        run: |
          npm run check
          npm run test:server
      - name: Diagnosticar módulos Android Expo
        working-directory: PortArcaneCodex
        run: |
          node -e "console.log('Autolinking',require('expo-modules-autolinking/package.json').version)"
          npx expo-modules-autolinking resolve --platform android --json > /tmp/codex-modules.json
          node -e 'const fs=require("fs");const o=JSON.parse(fs.readFileSync("/tmp/codex-modules.json","utf8"));(o.modules||[]).forEach((m,i)=>{let p=m.projects||[];console.log(i,m.packageName||m.name,m.version||"(sem versão)",p.map(x=>x.publication));});'
      - name: Gerar projeto Android com Expo
        working-directory: PortArcaneCodex
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compilar APK Android
        working-directory: PortArcaneCodex/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Port-Arcane-Codex-1.0-APK
          path: PortArcaneCodex/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
