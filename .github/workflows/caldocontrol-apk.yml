name: CaldoControl APK Android
on:
  push:
    branches: [main]
    paths:
      - 'CaldoControl/**'
      - '.github/workflows/caldocontrol-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: CaldoControl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android 35
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validar JavaScript incorporado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          code = html.split("\n<script>\n",1)[1].rsplit("\n</script>",1)[0]
          Path("/tmp/caldocontrol.js").write_text(code, encoding="utf-8")
          PY
          node --check /tmp/caldocontrol.js

      - name: Gerar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CaldoControl-2.3-debug-APK
          path: CaldoControl/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
