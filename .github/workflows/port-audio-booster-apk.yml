name: Port Audio Booster 3.0 - Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, feature/port-audio-v3]
    paths:
      - 'PortAudioBooster/**'
      - '.github/workflows/port-audio-booster-apk.yml'

permissions:
  contents: write

concurrency:
  group: port-audio-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Compilar Port Audio Booster 3.0
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verificar arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail
          test -f PortAudioBooster/app/build.gradle
          test -f PortAudioBooster/app/src/main/AndroidManifest.xml
          test -f PortAudioBooster/app/src/main/java/com/port/audiobooster/StudioActivity.java
          test -f PortAudioBooster/app/src/main/java/com/port/audiobooster/AudioProfiles.java
          test -f PortAudioBooster/app/src/main/java/com/port/audiobooster/SpectrumView.java
          test -f PortAudioBooster/app/src/main/java/com/port/audiobooster/DeviceAutoReceiver.java
          test -f PortAudioBooster/app/src/main/java/com/port/audiobooster/FloatingControls.java
          test -f PortAudioBooster/app/src/main/java/com/port/audiobooster/ProfileIO.java

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        working-directory: PortAudioBooster
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Calcular SHA-256 do APK
        run: sha256sum PortAudioBooster/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar artefato APK
        uses: actions/upload-artifact@v4
        with:
          name: PortAudioBooster-v3.0-Spotify-APK
          path: PortAudioBooster/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK no repositório
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PortAudioBooster/download
          cp PortAudioBooster/app/build/outputs/apk/debug/app-debug.apk PortAudioBooster/download/PortAudioBooster-v3.0-Spotify.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PortAudioBooster/download/PortAudioBooster-v3.0-Spotify.apk
          if ! git diff --cached --quiet; then
            git commit -m 'build(port-audio): publicar APK 3.0 [skip ci]'
            git push origin HEAD:main
          fi
