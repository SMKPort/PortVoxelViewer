name: Nexus Aterna RP checks
on:
  push:
    branches: [nexus-aterna-rp]
    paths:
      - 'nexus-rp/**'
      - '.github/workflows/nexus-rp-check.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check server scripts
        run: |
          node --check nexus-rp/server.js
          node --check nexus-rp/bridge.js
          node --check nexus-rp/client_relay.js
          node --check nexus-rp/chat_channel.js
          node --check nexus-rp/memory_context.js
          node --check nexus-rp/vision_analysis.js
          node --check nexus-rp/speech_synthesis.js
          node --check nexus-rp/voice_reply.js
          node --check nexus-rp/ai_conversation.js
          node --check nexus-rp/private_conversation.js
          node --check nexus-rp/public/voice.js
          node --check nexus-rp/public/affinity.js
          node --check nexus-rp/public/views.js
          node --check nexus-rp/public/upgrade.js
          node --check nexus-rp/public/evolution.js
          node --check nexus-rp/public/client.js
          node --check nexus-rp/public/alerts.js
          node --check nexus-rp/public/mind2.js
          node --check nexus-rp/public/app.js
          node --check nexus-rp/public/v4-shell.js
      - name: Check Python agent
        run: python -m py_compile nexus-rp/agent/bridge_agent.py
      - name: Run bridge integration tests
        run: node --test nexus-rp/tests/bridge.test.js nexus-rp/tests/chat-channel.test.js nexus-rp/tests/chat-settings.test.js nexus-rp/tests/memory-affinity.test.js nexus-rp/tests/vision.test.js nexus-rp/tests/client-relay.test.js nexus-rp/tests/client-ui.test.js nexus-rp/tests/http-routes.test.js nexus-rp/tests/live-events.test.js nexus-rp/tests/alerts-ui.test.js nexus-rp/tests/mind2-ui.test.js nexus-rp/tests/hearing.test.js nexus-rp/tests/speech.test.js nexus-rp/tests/mind2.test.js nexus-rp/tests/alerts-settings.test.js nexus-rp/tests/monitor-persistence.test.js nexus-rp/tests/voice.test.js nexus-rp/tests/ai-conversation.test.js nexus-rp/tests/private.test.js nexus-rp/tests/arcane.test.js nexus-rp/tests/v4-ui.test.js
