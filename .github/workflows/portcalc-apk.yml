name: PortCalc - Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PortCalc/**'
      - '.github/workflows/portcalc-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Testar e compilar PortCalc
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restaurar código-fonte do PortCalc
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f PortCalc/app/build.gradle ]; then
            cat PortCalc/.staging/part0{1..6} | base64 --decode > /tmp/portcalc-source.tar.xz
            echo 'aed6fce339a1f346c5a94816909d995578e45cdf0d187cd37c29c95815222062  /tmp/portcalc-source.tar.xz' | sha256sum --check
            tar -xJf /tmp/portcalc-source.tar.xz
          fi
          test -f PortCalc/app/src/main/python/engine.py
          test -f PortCalc/app/src/main/assets/index.html

      - name: Publicar código-fonte na pasta PortCalc
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d PortCalc/.staging ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add PortCalc
            git rm -rf --ignore-unmatch PortCalc/.staging
            if ! git diff --cached --quiet; then
              git commit -m 'feat(portcalc): publicar fontes Android [skip ci]'
              git push origin HEAD:main
            fi
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Executar testes do motor matemático
        working-directory: PortCalc
        run: |
          python -m pip install sympy==1.13.3
          python -m unittest discover -s tests -v

      - name: Compilar APK
        working-directory: PortCalc
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: PortCalc-APK-v1
          path: PortCalc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
