name: Build TimeFrame (NeoForge 1.21.1)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'minecraft-mods/timeframe/**'
      - '.github/workflows/build-timeframe.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build TimeFrame
        working-directory: minecraft-mods/timeframe
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: timeframe-neoforge-1.21.1
          path: minecraft-mods/timeframe/build/libs/*.jar
          if-no-files-found: error
