name: Port Math Solver - Gerar APK
on:
  push:
    branches: [main]
    paths:
      - 'PortMathSolver/**'
      - '.github/workflows/port-math-solver-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Testar motor de Álgebra Linear
        run: node --test PortMathSolver/tests/engine.test.js
      - name: Compilar APK
        run: gradle --no-daemon -p PortMathSolver assembleDebug
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: PortMathSolver-v1-debug-apk
          path: PortMathSolver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
