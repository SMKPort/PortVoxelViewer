name: Je Cobrancas APK Android
on:
  push:
    branches: [main]
    paths:
      - 'JeCobrancas/**'
      - '!JeCobrancas/download/**'
      - '.github/workflows/je-cobrancas-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: JeCobrancas/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validar interface e integracao Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("../index.html").read_text(encoding="utf-8")
          code=html.split("\n<script>\n",1)[1].rsplit("\n</script>",1)[0]
          Path("/tmp/je-cobrancas.js").write_text(code,encoding="utf-8")
          assert "JeNative.saveFile" in html and "JeNative.openWhatsApp" in html
          assert "function whatsapp" in html and "function balance" not in html  # balance e arrow function
          assert "const balance=" in html
          print("HTML e ponte Android validados.")
          PY
          node --check /tmp/je-cobrancas.js
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Je-Cobrancas-Android-APK
          path: JeCobrancas/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Atualizar APK para download público
        run: |
          mkdir -p ../download
          cp app/build/outputs/apk/debug/app-debug.apk ../download/Je_Cobrancas_1.1.apk
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JeCobrancas/download/Je_Cobrancas_1.1.apk
          if ! git diff --cached --quiet; then
            git commit -m "build(je-cobrancas): atualizar APK publico [skip ci]"
            git push origin HEAD:main
          fi
