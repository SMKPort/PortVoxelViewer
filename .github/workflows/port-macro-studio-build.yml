name: Port Macro Studio - NeoForge 1.21.1
on:
  push:
    branches: [port-macro-studio]
    paths:
      - 'port-macro-studio/**'
      - '.github/workflows/port-macro-studio-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Port Macro Studio (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile macro studio
        run: gradle -p port-macro-studio build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Port-Macro-Studio-NeoForge-1.21.1
          path: port-macro-studio/build/libs/portmacro-1.0.0.jar
          if-no-files-found: error
