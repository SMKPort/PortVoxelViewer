name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar Port Voxel Viewer v2.1 beta
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Os runners oficiais Ubuntu ja incluem o Android SDK.
      # Evita a falha do android-actions/setup-android@v3.
      - name: Localizar Android SDK preinstalado
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK nao encontrado em $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager nao encontrado no runner"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "SDK: $SDK_ROOT"
          "$SDKMANAGER" --version

      - name: Verificar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$ANDROID_HOME/platforms/android-35" && -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            echo "Android 35 e build-tools 35.0.0 ja instalados."
          else
            echo "Instalando componentes ausentes do Android SDK..."
            (yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null) || true
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validar scripts da interface v2.0
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/v2-library.js
          node --check app/src/main/assets/v2-studio.js
          node --check app/src/main/assets/skin-studio.js
          node tests/skin-format.test.cjs
          python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          match = re.search(r"<script>(.*?)</script>", source, re.S)
          assert match, "JavaScript principal nao encontrado no HTML"
          pathlib.Path("/tmp/port-voxel-core.js").write_text(match.group(1), encoding="utf-8")
          for filename in ["v2-library.js", "v2-studio.js", "skin-studio.js"]:
              assert f'src="./{filename}"' in source, f"Modulo nao carregado: {filename}"
          print("Interface principal e modulos encontrados.")
          PY
          node --check /tmp/port-voxel-core.js

      - name: Compilar APK Android debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Port-Voxel-Viewer-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
