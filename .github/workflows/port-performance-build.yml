name: Port Performance Monitor (NeoForge 1.21.1)
on:
  push:
    branches: [port-performance-monitor]
    paths:
      - 'performance-mod/**'
      - 'performance-web/**'
      - '.github/workflows/port-performance-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-test:
    name: Web API + security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check performance-web/server.js
      - run: node --check performance-web/public/app.js
      - run: node --test performance-web/tests/*.test.js
  mod-build:
    name: NeoForge 1.21.1 JAR (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compilar Port Performance Monitor
        run: gradle -p performance-mod build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Port-Performance-Monitor-1.21.1-NeoForge
          path: performance-mod/build/libs/*.jar
          if-no-files-found: error
