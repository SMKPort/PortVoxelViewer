name: Port SuperLive Inspector APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "PortSuperLiveInspector/**"
      - ".github/workflows/port-superlive-inspector.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar APK
        run: gradle --no-daemon -p PortSuperLiveInspector :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PortSuperLiveInspector-APK
          path: PortSuperLiveInspector/app/build/outputs/apk/debug/app-debug.apk
