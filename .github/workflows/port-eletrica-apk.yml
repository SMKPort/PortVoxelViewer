name: Port Elétrica | Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PortEletrica/**'
      - '.github/workflows/port-eletrica-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PortEletrica
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar cálculos
        run: node --test tests/solver.test.js
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PortEletrica-Android-APK
          path: PortEletrica/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
