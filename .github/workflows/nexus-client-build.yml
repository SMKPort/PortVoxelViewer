name: Nexus Aterna Client NeoForge 1.21.1
on:
  push:
    branches: [nexus-aterna-rp]
    paths:
      - 'nexus-client/**'
      - '.github/workflows/nexus-client-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build client-only mod (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Test autonomous warning rules (no Minecraft needed)
        run: |
          mkdir -p /tmp/nexus-alert-tests
          javac -encoding UTF-8 -d /tmp/nexus-alert-tests             nexus-client/src/main/java/com/port/nexusclient/NexusCombatAlerts.java             nexus-client/verification/NexusCombatAlertsTest.java
          java -ea -cp /tmp/nexus-alert-tests com.port.nexusclient.NexusCombatAlertsTest
      - name: Test streaming VAD, splitting and silence detection
        run: |
          mkdir -p /tmp/nexus-voice-tests
          javac -encoding UTF-8 -d /tmp/nexus-voice-tests \
            nexus-client/src/main/java/com/port/nexusclient/NexusVoiceSegmenter.java \
            nexus-client/verification/NexusVoiceSegmenterTest.java
          java -ea -cp /tmp/nexus-voice-tests com.port.nexusclient.NexusVoiceSegmenterTest
      - name: Test Nexus Mind 2.0 social rules
        run: |
          mkdir -p /tmp/nexus-social-tests
          javac -encoding UTF-8 -d /tmp/nexus-social-tests \
            nexus-client/src/main/java/com/port/nexusclient/NexusSocialRules.java \
            nexus-client/verification/NexusSocialRulesTest.java
          java -ea -cp /tmp/nexus-social-tests com.port.nexusclient.NexusSocialRulesTest
      - name: Test Nexus @a consent-only selector
        run: |
          mkdir -p /tmp/nexus-selector-tests
          javac -encoding UTF-8 -d /tmp/nexus-selector-tests \
            nexus-client/src/main/java/com/port/nexusclient/NexusHearingSelectors.java \
            nexus-client/verification/NexusHearingSelectorsTest.java
          java -ea -cp /tmp/nexus-selector-tests com.port.nexusclient.NexusHearingSelectorsTest
      - name: Test Nexus 2.2 private roleplay rules
        run: |
          mkdir -p /tmp/nexus-private-tests
          javac -encoding UTF-8 -d /tmp/nexus-private-tests \
            nexus-client/src/main/java/com/port/nexusclient/NexusPrivateRules.java \
            nexus-client/verification/NexusPrivateRulesTest.java
          java -ea -cp /tmp/nexus-private-tests com.port.nexusclient.NexusPrivateRulesTest
      - name: Test Nexus private narrative autonomy
        run: |
          mkdir -p /tmp/nexus-private-tests
          javac -encoding UTF-8 -d /tmp/nexus-private-tests \
            nexus-client/src/main/java/com/port/nexusclient/NexusPrivateRules.java \
            nexus-client/verification/NexusPrivateRulesTest.java
          java -ea -cp /tmp/nexus-private-tests com.port.nexusclient.NexusPrivateRulesTest
      - name: Test global permissions and hearing consent
        run: |
          mkdir -p /tmp/nexus-permissions
          javac -encoding UTF-8 -d /tmp/nexus-permissions \
            nexus-client/src/main/java/com/port/nexusclient/NexusPermissions.java \
            nexus-client/verification/NexusPermissionsSmokeTest.java
          java -ea -cp /tmp/nexus-permissions com.port.nexusclient.NexusPermissionsSmokeTest
      - name: Test dialogue wake phrases
        run: |
          mkdir -p /tmp/nexus-wake-tests
          javac -encoding UTF-8 -d /tmp/nexus-wake-tests \
            nexus-client/src/main/java/com/port/nexusclient/NexusWakeWords.java \
            nexus-client/verification/NexusWakeWordsTest.java
          java -ea -cp /tmp/nexus-wake-tests com.port.nexusclient.NexusWakeWordsTest
      - name: Test in-game permission dependencies and consent
        run: |
          mkdir -p /tmp/nexus-menu-tests
          javac -encoding UTF-8 -d /tmp/nexus-menu-tests \
            nexus-client/src/main/java/com/port/nexusclient/NexusPermissionControls.java \
            nexus-client/verification/NexusPermissionControlsTest.java
          java -ea -cp /tmp/nexus-menu-tests com.port.nexusclient.NexusPermissionControlsTest
      - name: Test owner memory retrieval
        run: |
          mkdir -p /tmp/nexus-memory-tests
          javac -encoding UTF-8 -d /tmp/nexus-memory-tests \
            nexus-client/src/main/java/com/port/nexusclient/NexusMemoryRecall.java \
            nexus-client/verification/NexusMemoryRecallTest.java
          java -ea -cp /tmp/nexus-memory-tests com.port.nexusclient.NexusMemoryRecallTest
      - name: Test exact offline spell grammar
        run: |
          mkdir -p /tmp/nexus-voice-tests
          javac -encoding UTF-8 -d /tmp/nexus-voice-tests \
            nexus-client/src/main/java/com/port/nexusclient/NexusVoiceGrammar.java \
            nexus-client/verification/NexusVoiceGrammarTest.java
          java -ea -cp /tmp/nexus-voice-tests com.port.nexusclient.NexusVoiceGrammarTest
      - name: Compile mod
        run: gradle -p nexus-client build --no-daemon --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Aterna-Client-1.21.1-NeoForge
          path: nexus-client/build/libs/*.jar
          if-no-files-found: error
