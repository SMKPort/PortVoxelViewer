# Render Blueprint - Port Arcane Codex backend
# Deploy from the private SMKPort/PortVoxelViewer GitHub repository.
# Set both secrets in the Render Dashboard during first Blueprint creation.
# NEVER commit OPENAI_API_KEY or APP_ACCESS_TOKEN.
services:
  - type: web
    name: port-arcane-codex-api
    runtime: node
    plan: free
    rootDir: PortArcaneCodex/server
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ACCESS_TOKEN
        sync: false
