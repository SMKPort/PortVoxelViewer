plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.caldocontrol.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.caldocontrol.app'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '2.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
