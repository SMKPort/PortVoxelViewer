plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.smkport.chuvaport'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.smkport.chuvaport'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/chuvaport-assets"]
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// Mantem a interface web da pasta ChuvaPort sincronizada com o APK.
tasks.register('syncChuvaPortWeb', Sync) {
    from(file('../..')) {
        include 'index.html', 'manifest.webmanifest', 'sw.js', 'assets/**'
    }
    into layout.buildDirectory.dir('generated/chuvaport-assets')
}
tasks.named('preBuild') {
    dependsOn tasks.named('syncChuvaPortWeb')
}
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn tasks.named('syncChuvaPortWeb')
    }
}
