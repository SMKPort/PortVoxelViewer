plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs {
        client { client() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}
repositories {
    mavenCentral()
}
// Vosk runs entirely on the player's PC. NeoForge/Minecraft already supply JNA.
// Match Minecraft's JNA version so an older transitive dependency cannot break OSHI.
configurations.all {
    resolutionStrategy.force 'net.java.dev.jna:jna:5.12.1', 'net.java.dev.jna:jna-platform:5.12.1'
}
dependencies {
    implementation 'com.alphacephei:vosk:0.3.45'
    additionalRuntimeClasspath 'com.alphacephei:vosk:0.3.45'
    jarJar('com.alphacephei:vosk:0.3.45') {
        exclude group: 'net.java.dev.jna'
    }
}
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
