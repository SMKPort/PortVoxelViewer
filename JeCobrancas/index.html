<body>
<div class="shell">
  <header class="topbar"><div class="brand"><div class="mark">Jé</div><div><strong>Jé Cobranças</strong><small>Adega da Jé</small></div></div><span class="offline-note">● Dados neste dispositivo</span></header>
  <nav class="nav" aria-label="Navegação principal">
    <button data-tab="dashboard" class="active"><span>◫</span> Resumo</button>
    <button data-tab="customers"><span>♙</span> Clientes</button>
    <button data-tab="entries"><span>▤</span> Movimentos</button>
    <button data-tab="catalog"><span>🛒</span> Cardápio</button>
    <button data-tab="settings"><span>⚙</span> Ajustes</button>
  </nav>
  <main id="content" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="client-modal"><div class="modal-content"><div class="modal-header"><h2 id="client-modal-title">Novo cliente</h2><button class="close" data-close="client-modal" aria-label="Fechar">×</button></div><form id="client-form" class="form-grid">
  <input type="hidden" id="client-id"><label class="field full"><span>Nome do cliente *</span><input id="client-name" required maxlength="100" placeholder="Ex.: Maria Silva" autocomplete="name"></label>
  <label class="field full"><span>WhatsApp (opcional)</span><input id="client-phone" inputmode="tel" maxlength="30" placeholder="(18) 99999-9999"></label>
  <label class="field full"><span>Observações (opcional)</span><textarea id="client-notes" maxlength="500" placeholder="Apelido, endereço ou outra observação"></textarea></label>
  <div class="field full"><p class="form-hint">O número é usado apenas para abrir uma mensagem de cobrança no WhatsApp. O envio é manual.</p></div>
  <div class="field full form-actions"><button type="button" class="btn ghost" data-close="client-modal">Cancelar</button><button class="btn primary" type="submit">Salvar cliente</button></div>
</form></div></dialog>
<dialog id="entry-modal"><div class="modal-content"><div class="modal-header"><h2 id="entry-modal-title">Novo lançamento</h2><button class="close" data-close="entry-modal" aria-label="Fechar">×</button></div><form id="entry-form" class="form-grid">
  <div class="field full"><div class="segmented"><button type="button" id="kind-charge" class="active" data-kind="charge">+ Adicionar consumo</button><button type="button" id="kind-payment" data-kind="payment">✓ Registrar pagamento</button></div></div>
  <label class="field full"><span>Cliente *</span><select id="entry-client" required></select></label>
  <label class="field full charge-only"><span>Produto / descrição *</span><input id="entry-desc" maxlength="140" placeholder="Ex.: 2 cervejas, refrigerante..." required></label>
  <label class="field charge-only"><span>Quantidade *</span><input id="entry-qty" type="number" min="1" max="99999" step="1" value="1" required></label>
  <label class="field charge-only"><span>Preço unitário (R$) *</span><input id="entry-price" inputmode="decimal" placeholder="Ex.: 7,50" required></label>
  <label class="field payment-only hide"><span>Valor recebido (R$) *</span><input id="entry-paid" inputmode="decimal" placeholder="Ex.: 20,00"></label>
  <label class="field payment-only hide"><span>Forma de pagamento</span><select id="entry-method"><option value="Pix">Pix</option><option value="Dinheiro">Dinheiro</option><option value="Cartão">Cartão</option><option value="Outro">Outro</option></select></label>
  <label class="field"><span>Data *</span><input id="entry-date" type="date" required></label>
  <label class="field charge-only"><span>Vencimento (opcional)</span><input id="entry-due" type="date"></label>
  <label class="field full payment-only hide"><span>Observação (opcional)</span><input id="entry-payment-notes" maxlength="140" placeholder="Ex.: Acerto de parte da conta"></label>
  <div class="field full"><div class="total-preview"><span id="preview-label">Total da compra</span><strong id="entry-preview">R$ 0,00</strong></div><p class="form-hint" id="entry-hint">O valor é calculado multiplicando quantidade pelo preço unitário.</p></div>
  <div class="field full form-actions"><button type="button" class="btn ghost" data-close="entry-modal">Cancelar</button><button type="submit" class="btn primary" id="save-entry">Salvar lançamento</button></div>
</form></div></dialog>

    if(!confirm(`Registrar ${newEntries.length} produto(s) no fiado de ${db.customers.find(c=>c.id===cid).name} por ${money(newEntries.reduce((s,e)=>s+e.amount,0))}?`))return;

    db.entries.push(...newEntries);
    if(save()){

    }else db.entries.length=previous;
  }
  function settings(){return head('Segurança','Ajustes e backup','Proteja as informações dos seus clientes.')+`<div class="settings-grid"><section class="settings-block"><h2>Salvar cópia de segurança</h2><p>Baixe todos os clientes e lançamentos em arquivo JSON. Guarde em local seguro, de preferência no seu Drive. Os dados deste app ficam apenas neste aparelho/navegador.</p><button class="btn primary" data-action="export-json">↓ Baixar backup completo</button></section><section class="settings-block"><h2>Relatório em planilha</h2><p>Exporte um CSV com nome, telefone, saldo, vencidos e situação de cada cliente. Pode ser aberto no Excel ou Planilhas Google.</p><button class="btn" data-action="export-csv">↓ Exportar clientes (CSV)</button></section><section class="settings-block"><h2>Restaurar backup</h2><p>Selecione um JSON previamente exportado. A restauração substitui os dados deste aparelho.</p><input type="file" id="import-file" accept="application/json,.json" style="max-width:100%"></section><section class="settings-block"><h2>Dados locais e privacidade</h2><p>Não há conta, servidor ou sincronização nesta versão. Limpar os dados do navegador pode apagar o controle. Faça backup frequente. O WhatsApp só abre uma mensagem pronta, e você confirma o envio.</p><button class="btn danger" data-action="clear-all">Apagar dados deste aparelho</button></section></div>`}
  function detail(){const c=db.customers.find(c=>c.id===selected);if(!c){selected=null;tab='customers';return customers()}const list=entriesFor(c.id);const b=balance(c.id);return `<button class="btn small ghost" data-action="back-customers" style="margin-bottom:17px">← Voltar aos clientes</button><section class="panel"><div class="details-head"><div><div class="eyebrow">Conta do cliente</div><h2>${esc(c.name)}</h2><p>${esc(c.phone||'WhatsApp não cadastrado')}</p></div>${status(c.id)}</div><div class="details-balance"><small>Saldo a receber</small>${money(b)}</div>${overdue(c.id)>0?`<div class="muted-card" style="color:var(--red);margin-bottom:15px">Valor vencido: ${money(overdue(c.id))}</div>`:''}${c.notes?`<div class="note" style="margin-bottom:15px">Observação: ${esc(c.notes)}</div>`:''}<div class="actions"><button class="btn primary" data-action="charge" data-id="${esc(c.id)}">+ Adicionar consumo</button><button class="btn" data-action="payment" data-id="${esc(c.id)}" ${b<=0?'disabled':''}>✓ Registrar pagamento</button><button class="btn" data-action="whatsapp" data-id="${esc(c.id)}" ${(!c.phone||b<=0)?'disabled':''}>WhatsApp</button><button class="btn ghost" data-action="edit-client" data-id="${esc(c.id)}">Editar cliente</button></div></section><section class="panel" style="margin-top:14px"><div class="panel-title"><h2>Histórico de ${esc(c.name)}</h2><span class="note">${list.length} lançamento(s)</span></div>${list.length?`<div class="history">${list.map(e=>`<div class="entry"><div><div class="entry-title">${e.type==='charge'?esc(e.description):'Pagamento recebido'}</div><div class="entry-meta">${e.type==='charge'?`${e.qty} × ${money(e.unitCents)}`:esc(e.method||'Outro')}${e.dueDate?' · Vencimento '+datefmt(e.dueDate):''} · ${datefmt(e.date)}</div></div><div class="entry-right"><span class="amount ${e.type==='payment'?'paid':'owed'}">${e.type==='payment'?'-':'+'}${money(e.amount)}</span><button class="btn small ghost" data-action="delete-entry" data-id="${esc(e.id)}">Excluir</button></div></div>`).join('')}</div>`:empty('▤','Sem lançamentos','Registre a primeira compra desse cliente.')}</section>`}
  function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('content').innerHTML=selected?detail():tab==='dashboard'?dashboard():tab==='customers'?customers():tab==='entries'?movements():tab==='catalog'?catalogue():settings();}
  function close(id){$(id).close()}
  function openClient(id){const c=db.customers.find(c=>c.id===id);$('client-modal-title').textContent=c?'Editar cliente':'Novo cliente';$('client-id').value=c?.id||'';$('client-name').value=c?.name||'';$('client-phone').value=c?.phone||'';$('client-notes').value=c?.notes||'';$('client-modal').showModal();$('client-name').focus()}
  function setKind(t){kind=t;document.querySelectorAll('.charge-only').forEach(e=>e.classList.toggle('hide',t!=='charge'));document.querySelectorAll('.payment-only').forEach(e=>e.classList.toggle('hide',t!=='payment'));$('kind-charge').classList.toggle('active',t==='charge');$('kind-payment').classList.toggle('active',t==='payment');$('entry-modal-title').textContent=t==='charge'?'Adicionar consumo':'Registrar pagamento';$('preview-label').textContent=t==='charge'?'Total da compra':'Pagamento recebido';$('entry-desc').required=t==='charge';$('entry-qty').required=t==='charge';$('entry-price').required=t==='charge';$('entry-paid').required=t==='payment';preview()}
  function preview(){const val=kind==='charge'?parseCents($('entry-price').value)*(Number($('entry-qty').value)||0):parseCents($('entry-paid').value);$('entry-preview').textContent=Number.isFinite(val)?money(val):money(0);const id=$('entry-client').value;const b=balance(id);$('entry-hint').textContent=kind==='charge'?'Quantidade × preço unitário. O total entra no saldo devedor.':`Saldo atual do cliente: ${money(b)}. Não é permitido receber acima do saldo.`;}
  function openEntry(t='charge',id){if(!db.customers.length){toast('Cadastre um cliente primeiro.');openClient();return}$('entry-form').reset();$('entry-client').innerHTML=db.customers.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');if(id)$('entry-client').value=id;$('entry-qty').value='1';$('entry-date').value=today();$('entry-due').value='';$('entry-price').value='';$('entry-paid').value='';setKind(t);$('entry-modal').showModal()}
  $('client-form').addEventListener('submit',ev=>{ev.preventDefault();const id=$('client-id').value;const name=$('client-name').value.trim();const phone=$('client-phone').value.trim();const notes=$('client-notes').value.trim();if(!name)return alert('Digite o nome do cliente.');if(id){const c=db.customers.find(c=>c.id===id);if(c){Object.assign(c,{name,phone,notes})}}else db.customers.push({id:uid(),name,phone,notes});if(save()){close('client-modal');render();toast(id?'Cliente atualizado.':'Cliente cadastrado!')}});
  $('entry-form').addEventListener('submit',ev=>{ev.preventDefault();const customerId=$('entry-client').value;const date=$('entry-date').value;if(!db.customers.some(c=>c.id===customerId)||!date)return alert('Preencha o cliente e a data.');let entry={id:uid(),customerId,type:kind,date};if(kind==='charge'){const qty=Number($('entry-qty').value);const unitCents=parseCents($('entry-price').value);const description=$('entry-desc').value.trim();if(!description||!Number.isSafeInteger(qty)||qty<1||qty>99999||!Number.isSafeInteger(unitCents)||unitCents<=0||qty*unitCents>Number.MAX_SAFE_INTEGER)return alert('Informe descrição, quantidade e preço válido.');Object.assign(entry,{qty,unitCents,amount:qty*unitCents,description,dueDate:$('entry-due').value})}else{const amount=parseCents($('entry-paid').value);if(!Number.isSafeInteger(amount)||amount<=0)return alert('Informe um valor válido.');if(amount>balance(customerId))return alert('O pagamento não pode superar o saldo em aberto.');Object.assign(entry,{amount,method:$('entry-method').value,description:$('entry-payment-notes').value.trim()})}db.entries.push(entry);if(save()){close('entry-modal');render();toast(kind==='charge'?'Consumo adicionado!':'Pagamento registrado!')}});
  document.addEventListener('input',ev=>{if(['entry-price','entry-qty','entry-paid'].includes(ev.target.id))preview();if(ev.target.id==='customer-search'){const pos=ev.target.selectionStart;search=ev.target.value;render();const field=$('customer-search');field.focus();field.setSelectionRange(pos,pos)}if(ev.target.id==='catalog-search'){const pos=ev.target.selectionStart;catalogSearch=ev.target.value;render();const field=$('catalog-search');field.focus();field.setSelectionRange(pos,pos)}
    if(ev.target.id==='history-search'){const pos=ev.target.selectionStart;historySearch=ev.target.value;render();const field=$('history-search');field.focus();field.setSelectionRange(pos,pos)}});
  document.addEventListener('change',ev=>{if(ev.target.id==='entry-client')preview();
    if(ev.target.id==='catalog-category'){catalogCategory=ev.target.value;render()}
    if(ev.target.id==='catalog-client'){catalogClientId=ev.target.value}
    if(ev.target.id==='catalog-due'){catalogDueDate=ev.target.value}if(ev.target.id==='customer-filter'){filter=ev.target.value;render()}if(ev.target.id==='import-file'&&ev.target.files?.[0])importBackup(ev.target.files[0])});
  document.addEventListener('click',ev=>{const kindBtn=ev.target.closest('[data-kind]');if(kindBtn){setKind(kindBtn.dataset.kind);return}const nav=ev.target.closest('[data-tab]');if(nav){selected=null;tab=nav.dataset.tab;render();return}const closeBtn=ev.target.closest('[data-close]');if(closeBtn){close(closeBtn.dataset.close);return}const btn=ev.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,id=btn.dataset.id;
    if(a==='catalog-plus')catalogAdjust(id,1);else if(a==='catalog-minus')catalogAdjust(id,-1);else if(a==='catalog-clear'){catalogCart={};render()}else if(a==='catalog-save')saveCatalogSale();else if(a==='new-client')openClient();else if(a==='new-entry')openEntry();else if(a==='edit-client')openClient(id);else if(a==='charge')openEntry('charge',id);else if(a==='payment')openEntry('payment',id);else if(a==='detail'){selected=id;tab='customers';render()}else if(a==='back-customers'){selected=null;tab='customers';render()}else if(a==='whatsapp')whatsapp(id);else if(a==='delete-entry')deleteEntry(id);else if(a==='export-json')exportJson();else if(a==='export-csv')exportCsv();else if(a==='clear-all')clearAll();
  });
  function whatsapp(id){const c=db.customers.find(x=>x.id===id);if(!c||balance(id)<=0)return;let num=c.phone.replace(/\D/g,'');if(num.length===10||num.length===11)num='55'+num;if(num.length<12||num.length>13){alert('Informe um telefone válido com DDD para abrir o WhatsApp.');return}const message=`Olá, ${c.name}! Tudo bem? Aqui é da Adega da Jé. Passando para lembrar que sua conta está com saldo de ${money(balance(id))}. Quando puder, entre em contato para acertarmos. Obrigada!`;{const url=`https://wa.me/${num}?text=${encodeURIComponent(message)}`;if(window.JeNative&&typeof window.JeNative.openWhatsApp==='function')window.JeNative.openWhatsApp(url);else window.open(url,'_blank','noopener,noreferrer')}}
  function deleteEntry(id){const e=db.entries.find(x=>x.id===id);if(!e)return;if(!confirm('Excluir este lançamento de '+money(e.amount)+'? O saldo será recalculado.'))return;const next=db.entries.filter(x=>x.id!==id);const bal=next.filter(x=>x.customerId===e.customerId).reduce((s,x)=>s+(x.type==='charge'?x.amount:-x.amount),0);if(bal<0)return alert('Não é possível excluir esta compra porque deixaria pagamentos acima do total de compras. Exclua ou corrija primeiro os pagamentos posteriores.');db.entries=next;if(save()){render();toast('Lançamento excluído.')}}
  function download(name,content,mime){if(window.JeNative&&typeof window.JeNative.saveFile==='function'){window.JeNative.saveFile(name,mime,content);return}const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000)}
  function exportJson(){download('je-cobrancas-backup-'+today()+'.json',JSON.stringify({app:'je-cobrancas',version:1,exportedAt:new Date().toISOString(),customers:db.customers,entries:db.entries},null,2),'application/json');toast('Backup baixado. Guarde com segurança!')}
  function csvcell(s){let v=String(s??'');if(/^[\s]*[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
  function exportCsv(){const rows=[['Nome','Telefone','Saldo (R$)','Vencido (R$)','Status','Observações'],...db.customers.map(c=>[c.name,c.phone,(balance(c.id)/100).toFixed(2).replace('.',','),(overdue(c.id)/100).toFixed(2).replace('.',','),balance(c.id)<=0?'Em dia':overdue(c.id)>0?'Vencido':'Em aberto',c.notes])];download('je-cobrancas-clientes-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(csvcell).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('Relatório CSV baixado!')}
  async function importBackup(file){try{const t=await file.text();const d=JSON.parse(t);if(!d||!Array.isArray(d.customers)||!Array.isArray(d.entries))throw new Error('Formato inválido');if(d.customers.some(c=>!c||typeof c.id!=='string'||typeof c.name!=='string'||(c.phone!=null&&typeof c.phone!=='string')||(c.notes!=null&&typeof c.notes!=='string'))||d.entries.some(e=>!e||typeof e.id!=='string'||typeof e.customerId!=='string'||!['charge','payment'].includes(e.type)||!Number.isSafeInteger(e.amount)||e.amount<=0||typeof e.date!=='string'||(e.type==='charge'&&(!Number.isSafeInteger(e.qty)||e.qty<=0||!Number.isSafeInteger(e.unitCents)||e.unitCents<=0||e.amount!==e.qty*e.unitCents))|| (e.description!=null&&typeof e.description!=='string')))throw new Error('Dados inválidos');const ids=new Set(d.customers.map(c=>c.id));if(d.entries.some(e=>!ids.has(e.customerId)))throw new Error('Há lançamentos sem cliente');if(!confirm(`Restaurar ${d.customers.length} cliente(s) e ${d.entries.length} lançamento(s)? Isto substituirá seus dados atuais.`))return;db={customers:d.customers,entries:d.entries};if(save()){selected=null;tab='dashboard';render();toast('Backup restaurado com sucesso!')}}catch(e){alert('Não foi possível restaurar: '+e.message)}finally{$('import-file').value=''}}
  function clearAll(){if(!confirm('ATENÇÃO: apagar todos os clientes e lançamentos deste aparelho? Faça um backup antes.'))return;if(!confirm('Confirma a exclusão definitiva de todos os dados locais?'))return;db={customers:[],entries:[]};if(save()){selected=null;tab='dashboard';render();toast('Dados locais apagados.')}}
  read();render();
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
