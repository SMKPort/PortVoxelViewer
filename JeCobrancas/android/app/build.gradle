plugins {
    id 'com.android.application'
}
android {
    namespace 'br.com.smkport.jecobrancas'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.smkport.jecobrancas'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main { assets.srcDirs += ["$buildDir/generated/je-cobrancas-assets"] }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.register('syncJeCobrancasWeb', Sync) {
    from(file('../..')) {
        include 'index.html', 'manifest.webmanifest', 'sw.js', 'icon.svg', 'catalogo.json', 'cardapio.html', 'imagens/**'
    }
    into layout.buildDirectory.dir('generated/je-cobrancas-assets')
}
tasks.named('preBuild') { dependsOn tasks.named('syncJeCobrancasWeb') }
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn tasks.named('syncJeCobrancasWeb')
    }
}
