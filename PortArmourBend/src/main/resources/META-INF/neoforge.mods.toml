modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mixins]]
config = "portarmourbend.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
displayTest = "IGNORE_ALL_VERSION"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "armourers_workshop"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "emotecraft"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "playeranimator"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
