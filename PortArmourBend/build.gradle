plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}
group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.kosmx.dev/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
neoForge {
    version = neo_version
    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}
dependencies {
    compileOnly 'maven.modrinth:y4JF3gXL:aXfzs8l3' // AW 3.4.0-beta.3, MC 1.21.1 NeoForge
    compileOnly 'dev.kosmx.player-anim:player-animation-lib-forge:2.0.4+1.21.1'
    compileOnly 'io.github.kosmx.bendy-lib:bendy-lib-forge:5.1'
    runtimeOnly fileTree(dir: 'run-mods', include: '*.jar')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.named('processResources', ProcessResources).configure {
    def props = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
        mod_authors: mod_authors,
        mod_description: mod_description,
        neo_version_range: neo_version_range,
        minecraft_version_range: minecraft_version_range,
        loader_version_range: loader_version_range
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
}
