plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.port.calculus'
    compileSdk 35

    defaultConfig {
        applicationId 'com.port.calculus'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            install 'sympy==1.13.3'
        }
    }
}
